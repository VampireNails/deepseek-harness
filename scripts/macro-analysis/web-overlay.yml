# dsh headless 的 fetch 能力 overlay（复验结论：headless 已挂 web search，仅缺 fetch）
# web / web-search-deepseek / tool-web / web-fetch-http 现已全部由 base bundle 挂载
# （packages/bundle/base/cordis.patch.yml，含 web-fetch-http provider），故此处只开
# tool-web 的 fetch 开关即可，切勿再用 `- insert` 挂 web-fetch-http（会与 base 重复
# 导致 `duplicate loader entry` 崩溃）。
- id: tool-web
  config:
    fetch: true
