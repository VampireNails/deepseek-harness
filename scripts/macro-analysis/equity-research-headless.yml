      ### 1.1 A 股真实数据证据层（`ashare_evidence.py`）

      三层真实 API，全部免费 HTTP 源：

      | 层 | 端点 | source_trust | CLI |
      |---|---|---|---|
      | 新闻 | 东财个股新闻 `search-api-web` + 全球资讯 7×24 `np-weblist` | third_party | `--layer news` / `global` |
      | 公告 | 巨潮 cninfo `hisAnnouncement/query` | **official**（交易所指定披露平台，一手） | `--layer announcement` |
      | 研报 | 东财研报列表 `reportapi` + 同花顺一致预期 `basic.10jqka` | third_party | `--layer research` |

      **用法**：`python ashare_evidence.py --code 600519 --layer all --limit 5 [--json] [--out <path>]`

      **硬纪律（改代码前必读）**：
      1. **单模块不得拆分**——东财防封节流状态（`EM_SESSION` + `_em_last_call`）是模块级单例，
         拆成三文件 = 三份独立节流器 = 突破「每秒 >5 次封 IP」红线。
      2. **真实源纪律**——本模块**不调用任何 LLM**，所有文本来自真实 API；每条证据强制标注 `source / url / time`。
      3. **fail-loud**——拉取/解析失败返回 `UNAVAILABLE` + 原因，**绝不静默返回空列表**：
         `EMPTY`（确实没有）与 `UNAVAILABLE`（没拉到）必须区分，否则判决书会把「证据缺失」误读成「无利空」。
         另加**零结果自检**：反查成功却 0 条时输出 `note` 提示「疑似参数问题」（巨潮 orgId 曾静默返回 0 条）。
      4. **标识不可派生**——巨潮 `orgId` 是内部公司 ID，**不能由证券代码逆推**（实测 4 种格式）。
         必须走官方反查接口 `topSearch/query`，反查失败回退拼接时打 `org_id_fallback=True`。
      5. **结论 ↔ 证据必须绑定**——[6] 证据区条目须标注与 [2]~[4] 命中标签的关联：
         「含「X」字样，可能关联 *Y*（系统匹配，需人工核实）」。**只做关键词提示，不做任何推断。**
         ⚠ 映射 key 必须来自 `SECTION_LABELS` 真实取值，不得凭标签名推断（曾误写导致功能静默不触发）。

      **回撤期事件归因**（[6] 小节）：回撤须记录**高点日期 + 持续交易日数**，再按时序列出窗口内公开披露。
      两条护栏：① 明写「是**时序对齐，不是因果推断**」；② 窗口 >250 日时追加覆盖提示，自曝「证据远非窗口全貌」。
      三条实现纪律：
      1. **必须按窗口真取数**：用 `fetch_announcements_range(segment="year")` 按自然年分段，覆盖铺满全窗口
         （普通分页 90 条全落近一年；按年分段 180 条覆盖 2021~2026 每一年）。
      2. **精确报告覆盖**，不靠「本列表远非全貌」免责：「窗口内共 758 条，已取 180 条（24%），
         按年分段 2021:30/221 2022:30/108 …」，覆盖粒度是**年**不是**条**。
      3. **按年挑关键节点展示**：按年分组 + 关键词降噪（报告/业绩/重大/重组/减持/问询…），每年最多 2 条，
         不取最近 8 条（会全是例行噪音）。

      **同期池等权基准**（回答「是个股问题还是市场问题」）：
      - 用 `pool_equal_weight()` 池内等权，不用沪深 300（指数需跨源取数，违反同源纪律）。
      - 性能坑：相关子查询 21s → 「只扫 `[date-tol, date]` 两段 + 窗口函数取每条最新」后 0.09s（tol=3）。
      - 边界声明必须写全：① 池内等权不是指数；② 池为成分快照，绝对水平受幸存者偏差影响，
        仅「超额」类差分类判据可用；③ 描述性对比，**跑输 ≠ 公司出问题**。

      **用途边界**：只用于**描述 + 风险归因佐证**；**严禁**引申为买卖信号、目标价、仓位或择时依据。

