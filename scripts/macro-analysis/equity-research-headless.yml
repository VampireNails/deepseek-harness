      ## 5. 决策层（headless 单 agent 模式的 PM 终审）— `ashare_decision.py`

      读 `ashare_risk_verdict.verdict()` 的命中标签，**确定性合成**三态决策。
      **当前决策空间（硬写死）**：正向「买入」alpha = 0 ⇒ 本层只输出：
      **回避 AVOID / 观察 WATCH / 中性 NEUTRAL / 无法判定 INDETERMINATE，不输出「买入」**。

      合成规则（无主观加权）：
      ① 数据质量 FAIL → 无法判定；② 任一已验证 bad 风险标签（两融 CROWDED / 农业 AVOID）→ 回避；
      ③ 有 warn 警示（两融 ELEVATED / 农业 COLLAPSE / 深度回撤 / 波动率高位 / qc 未判定）→ 观察；④ 否则 → 中性（附「无 ≠ 安全」）。

      纪律：数字必须来自库/引擎输出，禁止心算新比率；推算须标注过程；末尾注明「人工 gate 前不构成投资建议」。

