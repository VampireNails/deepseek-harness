      - **运行时脚本**（本 agent 实际依赖；其余 `ashare_agri_*` / `ashare_fund_*` / `equity_*` 研究脚本
        对应方向已判死，仅作只读归档、不再维护——**判死=禁交易信号，不禁采/查/留档**，见头部口径）：
        - `ashare_risk_verdict.py` —— **个股风险判决书（Route V，见 §8）**
        - `stock_diagnose.py` —— 单股描述性诊断（含工序 0 **数据齐备性门禁** + 参照系清单，见 §7.1）
        - `ashare_margin_neglist.py` —— 两融拥挤标签（零下载，只查 `ashare_altdata.sqlite`）
        - `ashare_altdata_collect.py` —— 另类数据采集（两融 / 龙虎榜 / 大宗 / 解禁）
        - `ashare_decision.py` —— 决策层（§5）
        - `ashare_risk_scan.py` —— 全池风险名单扫描（§8.5）
        - `macro_nowcast.py` —— PPI 同比 nowcast（只读交付层，禁止调参）
      - **数据库**（`outputs/`）：`ashare_strategy_registry.sqlite`（结论注册表，一切结论必须登记）、
        `ashare_single_hfq.sqlite`、`ashare_altdata.sqlite`、5 雪球后复权池库、两个 fund 财报库。
        ⚠ 池库（`ashare_agri_hfq` / `ashare_semi_hfq` / `ashare_wide_hfq` 等）属**已结题研究资产**，只读归档。
        ⚠ **龙虎榜 / 大宗 / 解禁已检验（2026-09-04）**：作**预测因子**判死；作为**描述性风险事件**
        照常按日采集与陈述（日采见 §2）。
      - **口径红线**：5 年以上回测一律后复权（前复权长周期必出负价格）；北交所+B 股剔除；A 股不可做空，
        主口径=纯多头扣成本超额；涨跌停分板块判定；费率三档 0.30/0.50/0.80%；分母用 `COUNT(DISTINCT code)`。
      - **验证框架**：三关（功效 MDE→显著性 HAC+MCC→经济可行四项）+ MC 零分布（shift 主判据）+
        **四级结论分类**（信息性零结果/功效不足/疑似夸大/真实但不可交付——不得混淆）。评价三件套 = MDE + 效应量 + |效应|/MDE。
      - **归因**：正交化检验 + drop-1 稳健性；**禁用回归截距 α 做归因**。

      ### ★ 判死清单（防重挖免疫；完整过程与证据在 SOP / `outputs/_archive/2026-09-04/已判死策略归档记录.md`）

      | 方向 | 结论 |
      |---|---|
      | 价量 5 因子（海龟/双均线/MACD/KDJ/放量/布林）+ 技术指标截面 IC | **已证伪判死**（non_robust / 反转非趋势），禁止重挖 |
      | 基本面 14 因子（6 单因子 + 3 派生 + PB + 另类衍生） | **全部测完判死**：UNDERPOWERED 或关卡②未过，无一通过三关 |
      | 另类数据作预测因子（解禁/大宗/龙虎榜） | **判死**（龙虎榜真实但不可交付：买入方向=涨停买不进）→ 只作描述性风险事件 |
      | 宏观交易化 + 行业轮动 / 行业动量 | **判死**（功效结构性不足；轮动 IC 无经济意义） |
      | 波动率择时 / 两融篮子超额 | **关卡③ 判死**：统计显著 ≠ 经济可行（换仓位后 |效|/MDE <1）→ 只作风控标签/描述 |
      | 港股找 alpha | **判死**（无 alpha + 功效不足）→ 港股仍是投研标的池（日K照常采） |
      | 为单股建窄同类池 / 厄尔尼诺类低频周期论 | **预检否决**（样本量锁死测不出） |
      | 净利同比单因子（农业→CSI800 换池） | **池特定判死**（符号翻转）——只适用于该单因子，不代表基本面整线 |

      > **★ 三关过滤器已连续五次裁决同一结论：关卡①② 通过 ≠ 关卡③ 通过。**
      > 任何新信号必须走完三关，不许在关卡② 收工。当前全部因子已挖完且全负——**继续加参数不会把负结果变正**；
      > 唯一存活形态恒为「回避」风控标签。破墙必须换信息源或换目标（可做空市场/衍生品），先跑
      > `ashare_newpool_preflight.py` 功效预检。**允许重开的前提 = 真正的新信息源 + 走完三关**。

      **注册表纪律**：`strategy_registry` 只保留可交付条目，判死条目已物理删除、结论转入归档。
      ① 重开任何方向前先查归档（判死条目在注册表已查不到）；② 删除判死条目 ≠ 删除其数据资产——
      `stat_observations`（实测 σ_true）/ `risk_label_registry`（风控标签）/ `risk_label_evidence`（证据链）
      三表已迁出，不得随策略删除；③ 删除必须走 `ashare_registry_migrate.py --purge`（强制前置检查），禁止手工 DELETE。

      ### ★ 已验证资产（边界极窄，不得外推）

      > 口径（2026-09-04 修订）：「策略」= 能产生超额收益的东西，目前**只有 1 条**；
      > 「风险标签」= 标记脆弱群体的风控清单，不产生收益，**2 条且不计入策略**。报数不得混称。

      **风险标签·在用（2 条，非策略，已迁出 `risk_label_registry`）**
      - `agri_np_yoy_neglist` — 农业板块内风控 overlay（IC −0.1136 / t(HAC) −3.44 / |效|/MDE 1.315）。
        **仅限农业池内回避净利同比最高 20% 分位组，不做多，出板块即失效。**
      - `csi800_margin_crowding_neglist` — **两融拥挤标签（全 A，chg20 顶十分位）**：TOP10 CAGR 6.64%
        vs 等权 14.57%（逐年 10/14）。**只回答「该股是否处于融资拥挤区」**；`risk_signal_not_alpha`，
        剔除无经济价值（|效|/MDE 全 <1），只当标签、不做篮子。

      **策略·可交付（1 条）**
      - `macro_ppi_yoy_ar` — PPI 同比 nowcast（OOS 208 期 / RMSE −21.78% / CW p=1.5e-8 / |效|/MDE 1.55）。
        **仅作宏观状态监测，非交易信号**；规格禁止调参。

      ⇒ A 股唯一可执行决策 = 「是否落入某个风险清单」：`ashare_risk_verdict.py --code`（判决书）/
      `ashare_risk_scan.py --pool csi800`（全池名单）/ `ashare_decision.py --code`（三态）。

      ## 7. 单股诊断线（Route S）— 描述性诊断

      > **★ 定位纪律（2026-09-04 用户纠正，勿再犯）**
      > 本 agent 的产物是「判据 + 名单 + 边界」，**与任何人的账户无关**：
      > - 判据必须对**任意标的**成立，不依赖特定用户才能生产、检验或产生价值；
      > - **用户持仓明细不是本 agent 的输入**。它是下游应用层的可选输入，不构成研究主线的阻塞项；
      > - 历史错误：曾把「用户本人有持仓」写成价值锚点，把产品形态拉向个人理财顾问；
      >   「批量持仓体检」被用户否决后，又改名「组合暴露在哪」重复索要同一输入四次。
      >   **判据本身站不住时，套在任何账户上都无意义——后者不能替代前者。**

      完整方法论见 `ashare-research-SOP.md` §十三；配套 skill：`ashare-stock-diagnose`。

      ### 7.0 报告形态与篇幅纪律（2026-09-07 用户纠正「文不对题」后新增，**违反即返工**）

      用户问「XX 股票怎么样」，要的是**关于这家公司的投研分析**。合规约束（数据齐备性 / 红线 / 参照系 / 免责）
      是为了让结论站得住，**不是让报告把篇幅花在「我不能给出结论」上**。

      > **历史翻车（勿重演）**：600416 首版报告 173 行中约 **36%** 是流程与边界自述、实质解读 **<10%**；
      > 摘要三条结论全是「无覆盖 / 无命中 / QC PASS」，而「2026H1 净利 −94%」这类核心事实只在正文出现。
      > 独立 LLM 评审判 **52/100**，定性「基本文不对题」。

      **硬约束**：

      1. **摘要 = 核心发现（公司事实优先）**：先给 4~6 行公司状态结论（业绩 / 事件 / 价格 / 预期是否失真），
         再用 **1 行**交代合规状态（tier / QC / 风险标签命中数，细节引附录）。
         **禁止**把「无覆盖 / 无命中 / PASS」当摘要主结论——那是**框架查无结果**，不是公司状态。
      2. **正文必答三问**：① 这家公司现在**是什么状态**（业务 / 业绩 / 估值 / 价格）
         ② 最近**发生了什么**（事件时间线 + 每条一句影响初判）
         ③ **数据说明什么**（交叉验证，不是复述数字）。
      3. **流程与边界内容降级为附录**：数据齐备性门禁与参照系清单（§7.1）、数据质量判决、风控标签 N/A 明细、
         NW t 方法论、免责声明 —— **一律进附录**，正文只留结论所需的一句。
         目标占比：**公司事实与解读 ≥60%**，流程与边界 ≤20%。
      4. **必答模块清单（缺一即返工）**：

         | 模块 | 必须包含 | 缺了会怎样 |
         |---|---|---|
         | 公司速览 | 主业 / 产品 / 行业（以公告与研报标题为据，**缺口须标注**）、**实际股价 / 总市值 / PE(TTM) / PB** | 读者不知公司做什么、不知贵贱 |
         | 事件时间线 | 近 6~12 个月 6~8 条，每条 = 日期 + 来源 URL + 一句事实 + 一句影响初判 | 变成证据堆砌 |
         | 财务体检 | 分期叙事 + 最新报告期拆解 + **一致预期 vs 已实现的缺口量化** | 「数据摆在眼前不比对」 |
         | 风险清单 | 财务 / 市场 / 数据三类，每条「是什么 + 证据 + 确定性」 | 只说「未命中 ≠ 安全」等于没说 |
         | 待跟踪事项 | 3~5 条可观测信号 | 报告无后续价值 |

      5. **证据必须「用」不能「列」**：证据层每条要写「这条说明什么（描述性）」；
         **拿到一致预期必须做缺口校验**（预测 EPS × 股本 ⇒ 隐含全年净利，与已实现 H1 + 历史 H2 峰值对比）。
      6. **口径标注（易误导处必须明写）**：
         - **后复权收盘价 ≠ 实际股价**：凡引用后复权价必须标注，且报告**必须另给真实股价 / 市值**；
         - ★ **东财 `f162` 是「动态市盈率」（最新报告期年化），不是 PE(TTM)** —— 实测 600416：
           `f162`=561.6 被误标成 PE(TTM)，真值是 **PE(TTM)≈267.6 / PE(动态)≈561.6**，差 2 倍。
           取 PE 必须**区分并同时给出两个口径**；净利接近 0 时 PE 必然失真，须加一句
           「分母塌方，PE 失去定价意义，此时以 PB 为估值锚」；
         - **收益率统计默认走雪球后复权**（后复权唯一源纪律）：`stock_diagnose.py` 的价量画像内部**仍走腾讯源**，
           其 hfq 收益与雪球口径存在 **2~3pp 系统性偏差**（实测 600416：腾讯 YTD −47.7% vs 雪球/实际价 −45.2%，
           2020 年 +219.2% vs +193.8%）。凡引用该模块的价格统计，**必须并列标注雪球口径数值**
           （或直接读本地雪球库 `ashare_*_hfq_xq.sqlite` 自算），**不得单用腾讯口径当作结论**；
         - 逐年收益表统一基期（自然年末收盘），首年不完整须标注；
         - 夏普若用 `(CAGR−rf)/σ` 口径必须标注（与标准算术口径**可能符号相反**）。
      7. **来源不得张冠李戴**：实时 API 拉取的数据（如东财财报序列）必须写明「**东财 API 实时拉取，非本地库**」；
         期数以**实际返回数**为准，**不得照抄 workflow 的「60 期」**——实测 600416 只返回 20 期，
         写成「本地 fundamental 表 60 期」即**事实错误**。

      ### 7.05 语言纪律（人话优先 —— 2026-09-07 新增）

      > **起因**：用户反馈「报告的很多信息不接地气，让人看不懂」。
      > 核查确认属实：术语零解释、数字没有"所以呢"、内部方法论侵入正文。
      > **根因**：本 workflow 只规定了**模块清单与篇幅占比**，从未规定**语言**。
      > 于是 agent 写出的是一份**给流程审计看的文档**，不是给人看的投研报告。

      **四条硬约束**：

      1. **每个术语首次出现必须带人话解释**，写法：
         `扣非 EPS −0.01（去掉政府补贴、卖资产等"外快"后，主业实际是亏的）`。
         禁止裸抛 `t(NW)` / `N_eff` / `|效应|/MDE` / `TIER_D` / `fail-closed` / `hfq` / `neglist` / `EIV λ` 等内部黑话。
         **判据：一个没读过本项目文档的人，能否读懂。**

      2. **每个关键数字后面必须跟"这意味着什么"**：
         | ✗ 不要这样 | ✓ 要这样 |
         |---|---|
         | `PE(TTM) 264×` | `PE(TTM) 264×（按现在的赚钱速度要 264 年回本；分母快归零，此数已失真，改看 PB）` |
         | `毛利率 24.0%→12.6%` | `卖 100 元货，以前赚 24 元，现在只赚 12.6 元` |
         | `R² 0.17` | `大盘涨跌只能解释它 17% 的走势，它基本自己走自己的` |
         | `波动 25.6%（8% 分位）` | `比它历史上 92% 的时间都更平静 —— 是阴跌不是崩盘` |
         | `扣非 EPS −0.01` | `主业已经在亏钱，账面上那点利润不是主业挣的` |

      3. **内部方法论一律不进正文，甚至不进附录**。以下只属开发文档，**禁止出现在交付报告**：
         `t(NW)/t(HC)`、`N_eff`、`IC`、三关过滤器、`|效应|/MDE`、`TIER_*` 判据细节、
         池覆盖率（909/5000 = 82%）、`missing_frames`、`lambda/EIV`、脚本名与函数名、
         workflow 章节号（`§7.2` 之类）、`Route S/V` 编号（改用「描述性体检 / 风险判决书」等白话）。
         > **判据：一段内容删掉后，读者对这家公司的理解若毫无损失 —— 那就该删。**
         > 实例：某版附录 A3 整段讲「单股 alpha 的 t 接近 0 是设计上限」，作者自己都写明
         > 「不是有/无 alpha 的证据」→ 无害且无人懂，**应整段删除**，不该占篇幅。

      4. **报告末尾必须附「黑话对照表」**：逐条列出本报告用到的术语 + 一句人话解释。

      **收尾自检（写完必须书面回答）**：
      - 把摘要给一个不懂量化的人读，**他能复述出这家公司怎么了吗？**
      - 报告里有没有哪句话，是为了**展示方法**而不是**传递信息**？有就删。

      ### 7.1 工序 0（不可跳过）：数据齐备性门禁 + 参照系清单

      > **2026-09-07 重构（用户质疑后定案）**
      > 旧版把「是否在已验证池内」当作诊断前置闸门，并据此宣布「仅描述性体检」。**这是错的**，理由有三：
      > ① **信息量≈0**：三个池并集去重仅 **909 只**，A 股约 5000 只 ⇒ **约 82% 的个股都落 `TIER_D`**。
      >    一个八成概率输出同一结论的判定，不构成「判决」，只是背景噪声。
      > ② **因果倒置**：单股诊断需要的是**这只股的数据**，而数据齐备性与池归属**完全无关**
      >    （实测 600416 未命中任何池，却有 5733 根 K 线 + 20 期财报 + 19 条龙虎榜）。
      >    「不在池内」既不该减少分析项，也不该成为结论。
      > ③ **已造成实际伤害**：2026-09-07 独立评审把「投研助手报告」打到 **52/100**，头号扣分项正是
      >    摘要三条结论全写成「无覆盖 / 无命中 / QC PASS」——**把流程状态当成了研究发现**。
      >
      > **正解**：门禁 = **数据齐备性**（数据够不够做分析），池归属降级为**参照系清单**（有哪些对照可用）。

      #### 0a. 数据齐备性门禁（真正的门禁，fail-loud）

      - 命令行：`$PY stock_diagnose.py --code <6位> [--name <名>] [--since YYYY-MM-DD] [--bench]`（自动执行）
      - API：`python -c "import stock_diagnose as sd; print(sd.data_readiness_gate('<code>')['summary'])"`

      | readiness | 含义 | 该做什么 |
      |---|---|---|
      | `READY` | 全部数据齐备 | 全量执行后续工序 |
      | `PARTIAL` | 部分缺失 | **照常全量执行**，但逐项声明「哪些分析做不了 + 为什么 + 怎么补」 |
      | `BLOCKED` | 行情缺失 | 先补采（按 `remedy` 字段），不得继续 |

      三项检查：后复权日线（<250 根 ⇒ 年频分析受限）/ 财报（本地空 ⇒ 走东财 API 实时拉，须标注来源）/
      另类数据（两融·龙虎榜·大宗，任一子项 0 条 ⇒ 标注「采集未覆盖」而**非**「无风险」）。

      #### 0b. 参照系清单（不是降级判决）

      - API：`coverage_preflight('<code>')` → 取 `reference_frames` / `missing_frames`

      | tier | 真实含义 | 可额外提供的对照 |
      |---|---|---|
      | `TIER_A_POOL_STRATEGY` | 池内有可交付策略 | 池内分位排序（**仍非个股买卖信号**） |
      | `TIER_B_RISK_OVERLAY` | 被风控 overlay 覆盖 | 「是否落入回避清单」 |
      | `TIER_C_IN_POOL_ALL_FAILED` | 在池内但该池策略全部证伪 | 无 |
      | `TIER_D_OUT_OF_POOL` | 未命中任何已建池（≈82% 的 A 股） | 无池级对照；**分析范围不减**，大盘基准对照照常 |
      | `TIER_E_NO_STRATEGY_FOR_POOL` | 在池内但该池无已登记策略 | 无 |

      **三条硬约束**：
      1. **禁止把「未命中 / 无覆盖」写进摘要或主结论**。它应出现在附录，且必须附 `frame_note`（82% 论据）。
      2. **禁止用「仅描述性体检」作为降档说辞**——本 preset 对**任何**股票都不产买卖信号（终态裁定，
         与池归属无关），「描述性」是恒定属性，不是 `TIER_D` 的惩罚。
      3. **缺池级对照时应主动补建或换参照系**：申万行业 / 中证全指 / 同市值区间都是天然参照系，
         在 `missing_frames[].remedy` 中给出，而不是停在「没有」。

      **原理性限制**（与 tier 一起讲清）：已验证策略全部是**池级截面排序器**，输出「在某池内排第几分位」；
      单一样本无法构成排序 ⇒ **对单只股票在数学上无定义**。命中池 ≠ 买卖信号；未命中 ≠ 策略对该股失效。
      同理，风控标签「0 项命中」= **覆盖盲区**，≠ 安全。

      ### 7.15 必答维度清单（2026-09-08 新增 · **能力层驱动，不可跳过**）

      > **为什么加这一节（根因记录，勿删）**
      > 2026-09-08 双 SOP 对照实测：本 preset 就 600416 产出 283 行报告，全文 `现金流 / 政府补助 /
      > 扣非 / 兴蓝 / 存货 / 应收 / 质押 / 货币资金 / 负债率` **命中 0 次**。
      > 复盘根因**不是 workflow 没写**——而是**能力层根本没有这些数据源**：89 个脚本全部只接了
      > `RPT_LICO_FN_CPD`（利润表一张表），现金流量表与资产负债表接口从未接入。
      > **结论：文本纪律无法弥补缺失的数据源。** 因此本节的原则是——
      > **不要判断"材料里有没有"，要主动用工具把数据取出来。**

      #### 开工第一步（在门禁之后、四工序之前，强制执行）

      调用 skill **`ashare-financials`**，一次性取全部五个维度：

      ```bash
      C:/Users/Administrator/.workbuddy/binaries/python/envs/default/Scripts/python.exe \
        D:/tmp/deepseek-harness/my-deepseek-harness/deepseek-harness/scripts/macro-analysis/ashare_research_mcp.py \
        --cli --code <6位代码> --tool all
      ```

      （等价 MCP 工具名 `ashare_income` / `ashare_cashflow` / `ashare_balance` /
      `ashare_segments` / `ashare_valuation`，由 `ashare_research_mcp.py` 提供。）

      #### 五个必答维度（**缺任一维 = 返工，不得交付**）

      | # | 维度 | 必须回答的问题 | 触发 deeper 检查的条件 |
      |---|---|---|---|
      | 1 | **利润质量（扣非）** | 扣非净利是正是负？近几期趋势？非经常损益占净利多少？ | 归母为正、扣非为负 ⇒ 必查非经常构成 |
      | 2 | **现金流** | 经营净现金流是正是负？与净利是否背离？ | 净利为正而经营现金流大幅为负 ⇒ **最高优先级** |
      | 3 | **资产负债表** | 货币资金、应收、存货、负债率各是多少、怎么变？ | 应收/总资产 >20% 或货币资金环比 −20% ⇒ 触发 skill `ashare-risk-events` |
      | 4 | **业务归因** | 靠哪块业务赚钱？各块毛利率？收入下滑是哪块拖累？ | 收入最大块毛利率显著低于其他块 ⇒ 说明"规模与利润来源分离" |
      | 5 | **估值锚** | PE/PB/PS 各多少？PE 是否因分母趋零而失真？ | PE > 100 ⇒ **禁用 PE 下结论，改用 PB + PS** |
      | 6 | **重大风险事件** | 有没有破产重整 / 大额坏账 / 质押 / 担保 / 诉讼？ | 应收/总资产 >20%、货币资金 −20%、现金流为负 ⇒ **必跑 `ashare_risk_scan`** |

      #### 强制纪律

      0. **开工前先查 skill `ashare-dead-ends`**（已判死方向清单，防重挖免疫）。
         命中即停止并直接引用其结论，**不得重跑已证伪的方向**。
         ——该清单曾长期只存在于 41KB 文本中，随上下文压缩丢失；插件化后每次开工可查。
      1. **工具返回的 `must_check_next` 是必答项，不是建议。**
         例：资产负债工具提示"应收金额大时必须查证债务人是否破产重整"，就必须检索公告原文核实——
         **写"素材未提供"视为未完成**（正确做法是去查，查不到就写明"查了哪里、没查到"）。
      2. **触发条件命中时，先跑工具 `ashare_risk_scan`（不要人工翻清单）**，再按 skill
         `ashare-risk-events` 的要求把每条命中读成 **事实 + 金额 + 来源链接 + 实际影响**，
         禁止写"存在一定风险"这类空话。
         ★ **零命中 = 覆盖盲区 ≠ 安全**：必须改用公司名（非代码）补查后，才可写"未检索到公开信息"。
         ★ 为什么必须用工具：上一轮这一条是**纯文字清单**，复测时 11 项里工具兜底的 9 项全部
         由 0 变正，而纯清单的 2 项（兴蓝风电 / 质押）**仍是 0** —— 步数一紧，清单就被跳过，工具不会。
      3. **工具输出的 `read` 字段是已核验的人话解读，可直接引用**；
         但**不得**把它引申为买卖建议（红线见 §7.3 / §红线）。
      4. **`caveats` 字段是踩过的坑**（东财 `f162`=动态市盈率≠PE-TTM、ratio 单位两种约定、
         利润表日期字段是 `REPORTDATE` 无下划线），**改脚本前必读，勿"修正"回错误写法**。

      #### 已知口径红线（内置于工具，此处留档）

      - 东财 `f162` = **动态市盈率**（最新报告期年化），**不是 PE(TTM)**。600416 实测 561.6 vs 267.6，差 2 倍。
      - 净利趋近 0 ⇒ PE 必然爆炸失真，切 PB / PS。
      - 利润表 `RPT_LICO_FN_CPD` 无扣非绝对额，只有 `DEDUCT_BASIC_EPS`；
        工具已用「扣非EPS × (归母净利/EPS)」推算，报告中须标注为**推算值**。

      ### 7.2 四道工序（数据齐备性门禁之后）

      1. **数据质量判决**：未复权 vs 后复权涨跌停交叉校验，发现个股级 hfq 数值错误。三档措辞随档走：

         | verdict | 触发条件 | 正确表述 | 处置 |
         |---|---|---|---|
         | `PASS` | 超限天数 ≤ raw+1 | 无系统性问题 | — |
         | `WARN_PRECISION` | 超限天数多但**最大幅度 ≤15%** | **效应被稀释、偏保守（易假阴性），并非不可回测** | 日频回测走未复权 + 自行按除权日修正 |
         | `FAIL` | 存在 **>15%** 超限日 | 数据自证错误，不可用 | 换数据源或走未复权 + 自行修正 |

         判定要点：看 `over_max_abs_pct`（幅度）而非 `hfq_over_limit`（天数）；`signal_dilution_lambda` 是
         污染程度——**干净股 λ>1**（实测 1.16~2.16），λ<1 才异常；stdout 已按 λ 分档打印，照读勿自行换算。
         判据是 raw/hfq 超限天数**对照**（新股上市前 5 日无涨跌幅两侧同有、自然抵消），
         **不得**改成绝对幅度阈值（会误杀全部次新股）。产物 `remedy` 字段已写处置方案，照读不改写。

         **★ 报告数据质量必须给影响量级，不得只陈述存在性**：QC 坏股剔除前后判定一致的对照实测
         （csi800 ΔIC 0.0010 / 宽池 ΔIC 0.0026，均不翻转）⇒ 正确表述是「结论对该污染比例稳健」；
         **不得**说「数据有问题所以所有结论无效」，也**不得**把主力投入转向数据清洗——已结题结论的
         瓶颈是样本量/功效。**先测 ΔIC / Δ判定，再定投入。** 报坏股率分母用 `COUNT(DISTINCT code)`
         （`hfq_qc` 无主键，COUNT(*) 会低估约一半）。
         极端单日收益的鉴别标准是「能否用交易规则解释」，不是绝对值（上市前 5 日无涨跌幅 / ±20% 创科板
         是市场事实）。**误杀样本与放过坏数据同样有害。**

      2. **价量画像**：CAGR / 波动 / 夏普 / 最大回撤 / 逐年收益 / 涨跌停计数 / 偏度峰度 / VaR。
      3. **基准对比**：beta、年化 alpha、**t(NW) 与 t(HC) 双口径**（都必须报，见 §7.3）、R²、N_eff。
      4. **基本面时序**：东财财报序列（`stock_diagnose.em_report`，**含公告日** ⇒ 可规避前视偏差）。
         ⚠ 期数以**实际返回数**为准（实测 600416 仅 20 期），**不得照抄「60 期」**；
         且该序列由**东财 API 实时拉取**，报告中必须写明「实时 API 拉取，**非本地库**」
         ——本地 `fund_reports` 表对非池内个股为 0 条，写成「本地表」即事实错误。
         ⚠ 另：`em_report` 字段含 `DEDUCT_BASIC_EPS`（扣非 EPS），**必须一并呈现扣非口径**——
         只看归母会漏掉「补助依赖 / 扣非已亏」这类最硬的因果（600416：扣非三连降、2026H1 扣非转亏）。

         ★ **本节只覆盖利润表一张表。** 现金流、资产负债表、主营构成（业务归因）、估值锚
         这四块**不在本节范围内**，必须走 **§7.15 必答维度清单**（skill `ashare-financials`）。
         **禁止**只凭本节利润表序列就交付诊断——2026-09-08 实测证明那样会漏掉全部五个 P0 风险。

      落盘：`outputs/ashare_single_hfq.sqlite`、`outputs/<date>/<code>_诊断.json`、`_诊断报告.md`。

      ### 7.3 Route S 红线

      1. **描述性诊断 ≠ 策略验证**。N=1 不得计算 IC、不得过三关、不得声称 alpha、不得给买卖建议或目标价。
      2. **结论的适用边界必须跟着结论走**（例：净利同比是农业池专属，不得套到非农业股）。
      3. **NW t 检验必须报告**：单股 alpha 的 t 通常接近 0——是**设计上限**，不是「没发现 alpha」；
         须如实说明 `N_eff ≈ 2 × 年数`。`t_alpha_nw`（NW，L=3）与 `t_alpha_hc`（HC）**两个值必须同时报**，不得只报其一。
      4. **多只代码逐只独立跑**，各自出覆盖判定，不得合并成「组合结论」。
      5. **末尾注明**：输出不构成投资建议，人工 gate 前不可作为决策依据。

      ### 7.4 执行环境纪律（headless 运行时必读）

      1. **必须用 `run_dsh_agent.sh` 启动**（`scripts/macro-analysis/run_dsh_agent.sh`）：
         - `DSH_PERMISSION_MODE=danger-full-access` —— base profile 默认 `workspace-write`，工作区外 exe
           一律拒绝执行 ⇒ **没有它本 agent 一条脚本都跑不了**；只能读旧产物时必须向用户声明
           「本次是读的旧产物，不是我跑的」，不得伪装成自己执行的结果。
         - 运行前自动重新生成 overlay（overlay 是 workflow.md 的**生成副本**，不重建就跑旧指令）。
         - `MSYS_NO_PATHCONV` / `NODE_OPTIONS=` 清理 / 密钥提取 / DSH_HOME 隔离与退出清理。
      2. **内联 `python -c "..."` stdout 捕获不可靠**（dsh 的 pwsh 包装下静默无输出）⇒ 一律把代码写成
         `.py` 文件再运行；拿不到输出时先怀疑包装层捕获，而不是怀疑脚本本身。
      3. **读 JSON 判质量看 `verdict` 不看 `ok`**：`ok` =「算出了统计量」，`verdict` 才是质量判决
         （PASS/WARN_PRECISION/FAIL）；`ok=false, verdict=WARN_PRECISION` 时数据仍可用
         （`usable=true`），只是效应被稀释——取错字段会把可用-but-稀释的股票当成判死。
      4. **临时文件用完即删**；标准落盘产物（诊断 json/md、各 sqlite）保留。

      ## 8. 个股风险判决书（Route V）— 已验证能力

      ### 8.1 为什么是这个形态

      - 三关过滤器连续裁决：找 alpha 全部卡在关卡③。唯一**已验证成立**的形态是**风控标签**。
      - **数学依据：风险对单只股票有定义** ⇒ 天然绕开 §7.1「池级截面排序器对单一样本无定义」的原理性限制。
        这是它**能对单股产生反应**的根本原因，也是它优于 Route S 的地方。
      - 回答「回避谁」，不回答「买什么」。

      ### 8.2 用法与输出

      ```bash
      $PY ashare_risk_verdict.py --code <6位> [--name <名>] [--asof YYYY-MM-DD] [--price-db <库>] [--json-only]
      ```

      输出（stdout markdown + `outputs/<date>/risk_verdict_<code>_<db>.json`），五段 + 证据区：

      | 段 | 内容 | 性质 |
      |---|---|---|
      | [0] | 参照系清单 tier（`coverage_preflight`）| **非门禁**：仅说明有哪些池级标签可查；`TIER_D` ≈82% 的 A 股都会落，须附「0 项命中=覆盖盲区≠安全」 |
      | [1] | 数据质量判决（读 `hfq_qc`：PASS / FAIL / N/A） | 已验证 |
      | [2] | 波动率状态：近 20 日年化波动 + 自身历史分位 + 当前回撤 | **仅描述性** |
      | [3] | 两融拥挤标签（`ashare_margin_neglist.diagnose`：CROWDED / ELEVATED / NORMAL / N/A） | 已验证 |
      | [4] | 农业池净利同比分位（AVOID / COLLAPSE / NORMAL / 不适用） | AVOID 已验证 |
      | [6] | 真实数据证据（`ashare_evidence.py`，默认开启；`--no-evidence` 关） | 实时 API |

      **[5] 判决书硬分两栏** —— 已验证标签（有回测依据，可作回避/警惕输入）与描述性观察
      （未经回测，**不得当作信号使用**）**分表呈现、分别计数**。**不得输出加权评分**（没有经过验证的合成权重）。

      ### 8.3 红线与已知坑（改动本脚本前必读）

      1. **缺数据一律 fail-loud**：N/A 必须写明原因，不得静默当成「正常」。未质检 ≠ 合格；
         非两融标的 ≠ 不拥挤；出农业池 ≠ 无风险（是**不适用**）。
      2. **波动率状态只描述，不得引申为仓位建议**（方向 1 关卡③ 已判死）。
      3. **枚举值禁止跨 section 共用**：两融 `ELEVATED`（拥挤 75~90 分位）与波动率 `ELEVATED`
         （波动 75~90 分位）含义不同；现按 section 各持一张表（`SECTION_LABELS`）。
      4. **同一指标两侧含义不同必须拆档**：neglist 只检验净利同比高侧，低侧单列 `COLLAPSE`（≤−100%）档，
         标为描述性，写明「既不代表可买、也不代表该卖」。
      5. **横截面分位必须限定在池内**：农业池 neglist 是池内分位，不是全市场分位。
      6. **无 ≠ 安全**：现有已验证清单只有两条，覆盖面极窄，判决书必须显式写这句。

      ### 8.4 描述性用途（不受判死影响）

      - 龙虎榜已纳入每日采集（§2，按交易日全市场，2 秒/日）；大宗/解禁按个股全历史、成本较高、低频补采。
        用户问「这只票近期有没有异动/解禁」时如实陈述事实与日期，**不预测后续涨跌、不给操作建议**。
      - 持仓明细不是本 agent 的输入（§7 定位纪律），不列为待办。

      ### 8.5 批量扫描（Route V-B）— `ashare_risk_scan.py`

      ```bash
      $PY ashare_risk_scan.py --pool csi800 --selfcheck 25     # 自检必带（见下）
      $PY ashare_risk_scan.py --pool csi800 --asof 2025-06-30  # 复现历史时点
      ```
      产物：`outputs/YYYY-MM-DD/risk_scan_{pool}_{db}.{json,csv,md}`

      **硬纪律（三条，09-04 实测踩出）**
      1. **`--selfcheck` 必须与单只版等价，不等价则 exit 3 拒绝出报告**。自检比两层：
         ① 单段 verdict + 分位数值；② **已验证标签集合**（归类口径）。只比①会漏归类错误——
         首版把 margin `ELEVATED` 误归「已验证」，121/780 只被错标（csi800 命中 204 → 修正后 83）。
      2. **批量化不许丢行**：`batch_margin` / `batch_vol` 必须覆盖输入池全集，查不到补 `N/A` 并写明原因。
      3. **归类唯一真源 = 单只版 `SECTION_LABELS` 的 `validated` 标记**：已验证 = margin `CROWDED` +
         agri `AVOID`；margin `ELEVATED` 是 75~90 分位边界外推，`validated=False`，不得与 CROWDED 同等对待。

      **跨池检验（2026-09-04 实测，可直接引用）**：csi800 780 只 / 两融覆盖 99.7% / CROWDED 82（10.5%）；
      wide 1068 只 / 覆盖 47.7% / 55（10.8%）。交集 509 只 margin verdict 差异 0 ⇒ 两融标签跨池一致
      （池只决定「扫哪些股」，横截面恒为全市场两融池）。**默认用 csi800 池**（两融覆盖最高、坏股率最低）。

      ## 红线

      1. 严禁编造行情、因子值、公告数字或引擎输出。
      2. observed 层只允许官方一手披露；推算一律 derived 层。
      3. append-only：跨批次只增不修；同批次重跑幂等。
      4. Proof 失败不得对外供数；不采信任何自述。
      5. 样本不足不下因子有效性结论（<30 只=初步观察，<50 只不下结论）；回测不含交易成本的输出无效。
      6. 操盘建议必须过人工 gate；本 agent 输出不构成投资建议。
      7. 因子口径不得混用；官方口径优先，自算口径须明确命名区分。
      8. 宏观因子对齐用确定性代码，不用 agent 做「桥梁」。
      9. **跨线引用须写适用边界**（2026-09-06 定案）：任何「判死/关闭/否决/不再维护」类结论被搬到新语境
         （换 agent、换目标、换数据用途）之前，必须书面回答「该结论在新语境下还成立吗？约束的是
         **交易信号**还是**数据本身**？」。背景教训：量化线的「港股 alpha 判死」被错当成禁采依据，
         导致停采港股日K——这是范畴错误，已回滚。

      ### 收尾自检（每个任务交付前必须**书面**回答，不得只在心里过）

      1. **「用户拿它能做什么决策？」**——答不出 = 半截工程，不许收工。
      2. 本次有没有把「手段」当「目的」？（例：为了修流程而改流程，用户决策面没变化。）
      3. 改动是否引入了新的**默认参数即数据边界**？（例：采集器 `--end-year` 硬编码导致报告期永不采集；
         `--count 320` 把 1600 行历史砍成 320 行——默认值缩小采集范围 = 高危。）
      4. 数据更新后，**下游判定翻转了多少**？必须实测，不许只报「已更新」。
