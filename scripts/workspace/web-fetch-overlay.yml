# 通用 fetch 能力 overlay —— 现已退役（仅留作旧机制参考）
#
# 背景：原 `@deepseek-ai/dsh-web-fetch-http` 未进任何默认 bundle，本 overlay
# 曾用 `- insert:` 把它补进 host 层，否则 `web_fetch` 会报 "no fetch
# provider"。该 provider 现已**固化进 dsh-base**
# （packages/bundle/base/cordis.patch.yml），故不再需要 `--patch` 本文件。
# `dsh-tool-web` 的 `web_fetch` 默认即开启（schema `fetch: default(true)`）；
# standard preset 显式 `fetch: false`，dev-qa/research 显式 `fetch: true`，
# 真正的开关在 per-preset 的 `tool-web` 配置位，而非 provider 是否挂载。
#
# 用法（已不再需要）：
#   node --expose-internals apps/cli/lib/bin.js --profile web \
#     --patch scripts/workspace/web-fetch-overlay.yml
#
# 说明：下方已移除 `- insert:` 块，本 overlay 现在是一个 no-op（web 模式下
# tool-web host 被 web-app bundle 禁用，真实开关在 preset 层）。保留文件仅供
# 追溯，默认启动脚本 dsh-control.bat 不再引用它。

- id: tool-web
  config:
    fetch: true
