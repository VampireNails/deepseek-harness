name: Intel Linux
on:
  push:
    branches: [intel]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intel-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plugins:
    # Reuse the existing Linux Host; never allocate GitHub-hosted build compute.
    # Only trusted intel pushes/manual runs can execute on this private runner.
    runs-on: [self-hosted, Linux, X64, dsh-local]
    timeout-minutes: 15
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify existing Linux toolchain
        run: |
          node --version
          test "$(pnpm --version)" = "11.7.0"
      - name: Plugin syntax and regression
        run: bash intel/verify-linux.sh
