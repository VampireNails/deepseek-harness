name: Intel Linux
on:
  push:
    branches: [intel]
  pull_request:
    paths: ['intel/**', 'intel-plugins/**', '.github/workflows/intel-linux.yml']
permissions:
  contents: read
concurrency:
  group: intel-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plugins:
    runs-on: ubuntu-24.04
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
          dest: ${{ runner.temp }}/intel-pnpm
      - name: Plugin syntax and regression
        run: bash intel/verify-linux.sh
