# The `equity-analysis` agent preset: the equity factor & quotes vintage surface.
#
# Format mirrors the `macro-analysis` preset: a cordis AGENT-PLANE composition
# listing only what this agent HAS. The host composition (base.cordis.yml +
# web.cordis.yml) keeps the registries, sandbox, approval stack, persistence
# and model route — a preset must not own those.
#
# Tools wired here:
#   - fs (read / write / edit) + fs-search for reports & data
#   - bash / pwsh to run the equity scripts under scripts/macro-analysis/
#   - web to pull announcements / quotes when a manual fetch is needed
#   - skill / goal / todo / ask-user for orchestration
#
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # Web preset and headless overlay both read this single workflow source.
    # Resolved from the user home (NOT cwd) so the preset behaves identically
    # regardless of the directory the CLI is launched from, and so that
    # `~/.dsh/.agent-presets/<name>/workflow.md` is the one true source.
    text: !!js >-
      process.getBuiltinModule('node:fs').readFileSync(
      process.getBuiltinModule('node:path').join(process.env.USERPROFILE || process.env.HOME,
      '.dsh', '.agent-presets', 'equity-analysis', 'workflow.md'), 'utf8')

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── shells ──────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

# ── web ─────────────────────────────────────────────────────────────────────

# Fallback fetch for announcements / quotes when a manual pull is needed.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'

# ── skills & orchestration ─────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# Delegation is intentionally omitted: this rc.5 installation does not ship
# @deepseek-ai/dsh-delegation. Multi-role decision orchestration lives in the
# decision layer (web profile + dsh-agent-teams), not in this data preset.
