# The `explore` agent preset: read-only codebase exploration.
#
# Flat, realm-free style mirroring `research` / `security-audit`. Deliberately
# mounts NO shell (bash/pwsh) so the agent physically cannot write — it is the
# cheapest, strictest read-only preset, ideal for parallel fan-out that keeps the
# parent session's context light. Host composition owns registries, sandbox,
# approval, persistence and model route.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: !!js >-
      process.getBuiltinModule('node:fs').readFileSync(
      process.getBuiltinModule('node:path').join(process.cwd(),
      'apps', 'cli', 'config', 'agent-presets', 'explore', 'workflow.md'), 'utf8')

# ── filesystem (read-only) ──────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── web (search only, fetch OFF for SSRF hygiene) ───────────────────────────

# Local codebase exploration does not need page capture; fetch stays OFF.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false

# ── skills & orchestration ──────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
