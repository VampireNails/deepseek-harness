# The `explore` agent preset: read-only codebase exploration.
#
# Flat, realm-free style mirroring `research` / `security-audit`. Deliberately
# mounts NO shell (bash/pwsh) so the agent physically cannot write — it is the
# cheapest, strictest read-only preset, ideal for parallel fan-out that keeps the
# parent session's context light. Host composition owns registries, sandbox,
# approval, persistence and model route.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: !!js >-
      (function () {
      const fs = process.getBuiltinModule('node:fs');
      const path = process.getBuiltinModule('node:path');
      const home = process.env.USERPROFILE || process.env.HOME || process.getBuiltinModule('node:os').homedir();
      const cands = [
      path.join(process.cwd(), 'packages', 'preset', 'agent-presets', 'presets', 'explore', 'workflow.md'),
      path.join(home, '.dsh', '.agent-presets', 'explore', 'workflow.md')
      ];
      for (const c of cands) {
      try {
      return fs.readFileSync(c, 'utf8');
      } catch (e) {}
      }
      throw new Error('preset explore: workflow.md not found; tried ' + cands.join(' | '));
      })()

# ── filesystem (read-only) ──────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── web (search only, fetch OFF for SSRF hygiene) ───────────────────────────

# Local codebase exploration does not need page capture; fetch stays OFF.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false

# ── skills & orchestration ──────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
