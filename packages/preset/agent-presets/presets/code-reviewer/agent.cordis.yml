# The `code-reviewer` agent preset: dedicated read-only code review.
#
# Flat, realm-free style mirroring `security-audit` / `research` / `macro-analysis`
# (verified loadable on this host). The host composition owns registries,
# sandbox, approval, persistence and model route — a preset must not own those.
#
# Read-only first: shells are mounted only so the agent can run *non-mutating*
# inspection (git diff / log / blame, read file perms). The workflow.md forbids
# any write or mutating command — this preset produces a review report, never edits.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: !!js >-
      (function () {
      const fs = process.getBuiltinModule('node:fs');
      const path = process.getBuiltinModule('node:path');
      const home = process.env.USERPROFILE || process.env.HOME || process.getBuiltinModule('node:os').homedir();
      const cands = [
      path.join(process.cwd(), 'packages', 'preset', 'agent-presets', 'presets', 'code-reviewer', 'workflow.md'),
      path.join(home, '.dsh', '.agent-presets', 'code-reviewer', 'workflow.md')
      ];
      for (const c of cands) {
      try {
      return fs.readFileSync(c, 'utf8');
      } catch (e) {}
      }
      throw new Error('preset code-reviewer: workflow.md not found; tried ' + cands.join(' | '));
      })()

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── shells (read-only inspection only) ──────────────────────────────────────

# The host layer gates bash/pwsh by platform (win32 → pwsh only). Mounted so the
# agent can run git read commands (diff/log/blame); workflow.md forbids writes.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

# ── web (fetch OFF for SSRF hygiene; search may stay on for style-guide lookup) ──

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false

# ── skills & orchestration ──────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
