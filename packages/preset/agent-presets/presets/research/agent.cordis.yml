# The `research` agent preset: research & information synthesis.
#
# Same flat, realm-free style as `dev-qa` / `macro-analysis`. The host
# composition keeps registries, sandbox, approval, persistence and model route.
# Delegation (parallel subagents) is omitted for now — see
# `standard/agent.cordis.yml` for the grouped structure it requires.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: !!js >-
      (function () {
      const fs = process.getBuiltinModule('node:fs');
      const path = process.getBuiltinModule('node:path');
      const home = process.env.USERPROFILE || process.env.HOME || process.getBuiltinModule('node:os').homedir();
      const cands = [
      path.join(process.cwd(), 'packages', 'preset', 'agent-presets', 'presets', 'research', 'workflow.md'),
      path.join(home, '.dsh', '.agent-presets', 'research', 'workflow.md')
      ];
      for (const c of cands) {
      try {
      return fs.readFileSync(c, 'utf8');
      } catch (e) {}
      }
      throw new Error('preset research: workflow.md not found; tried ' + cands.join(' | '));
      })()

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── shells ──────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'

# ── web ─────────────────────────────────────────────────────────────────────

# `web_search` is always on; `web_fetch` also defaults ON in dsh-tool-web. The
# host-plane provider @deepseek-ai/dsh-web-fetch-http is now solidified into the
# dsh-base bundle (packages/bundle/base/cordis.patch.yml), so no `--patch` overlay
# is needed: this preset's `fetch: true` makes page capture resolve at runtime.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true

# ── skills & orchestration ──────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── macro data (read-only MCP bridge) ───────────────────────────────────────
# Bridge the local `macro-clean-db` MCP server (scripts/macro-analysis/macro_mcp_server.py)
# so research can cite the cleaned vintage macro dataset directly. Read-only; the
# server exposes 7 tools (mcp__macro-clean-db__*). Spawned via the project's
# unified python venv — the only interpreter that has the `mcp` package.
- id: mcp-macro-clean
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: macro-clean-db
    transport: stdio
    command: 'C:/Users/Administrator/.workbuddy/binaries/python/envs/default/Scripts/python.exe'
    args: ['D:/tmp/deepseek-harness/my-deepseek-harness/deepseek-harness/scripts/macro-analysis/macro_mcp_server.py']
    env:
      MACRO_CLEAN_DB: 'D:/tmp/deepseek-harness/outputs/macro_clean.sqlite'
    cwd: 'D:/tmp/deepseek-harness/my-deepseek-harness/deepseek-harness'
    failOnStartupError: false
